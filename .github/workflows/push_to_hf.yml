name: Push repo to Hugging Face Space

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Configure git identity
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # Track common large/binary assets with LFS (safe defaults)
      - name: Track large files with LFS patterns
        run: |
          git lfs track "*.zip" "*.tar" "*.tar.gz" "*.7z" || true
          git lfs track "*.bin" "*.pt" "*.ckpt" "*.safetensors" "*.gguf" || true
          git lfs track "*.png" "*.jpg" "*.jpeg" "*.mp4" || true

          # Commit .gitattributes if it changed
          if [ -f .gitattributes ]; then
            git add .gitattributes
            git commit -m "chore: configure git-lfs" || true
          fi

      # If big files are already in history, migrate them into LFS
      - name: Migrate history to LFS (only if files > 10MB exist)
        run: |
          if find . -type f -size +10M | head -n 1 | grep -q .; then
            git lfs migrate import --everything
          else
            echo "No files >10MB detected; skipping LFS migrate."
          fi

      - name: :sparkles: Add github to hf sync

        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          HF_REMOTE="https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git"

          git remote remove hf 2>/dev/null || true
          git remote add hf "$HF_REMOTE"

          # Force push because LFS migrate rewrites history
          git push hf --force --all
          git push hf --force --tags
